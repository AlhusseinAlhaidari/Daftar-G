name: daftar_g
description: "دفتر ديون ذكي وآمن لأصحاب المحلات الصغيرة"
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.4.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI Components
  cupertino_icons: ^1.0.8
  font_awesome_flutter: ^10.7.0
  
  # State Management - Using Riverpod for better performance
  flutter_riverpod: ^2.5.1
  
  # Local Database
  sqflite: ^2.3.3+1
  path: ^1.9.0
  
  # Local Storage
  shared_preferences: ^2.2.3
  
  # Date & Time
  intl: ^0.19.0
  
  # Google Drive Integration
  google_sign_in: ^6.2.1
  googleapis: ^13.2.0
  googleapis_auth: ^1.6.0
  
  # URL Launcher
  url_launcher: ^6.3.1
  http: ^1.2.2
  
  # PDF Generation
  pdf: ^3.11.1
  printing: ^5.13.2
  
  # File Picker
  file_picker: ^8.1.2
  
  # Path Provider
  path_provider: ^2.1.4
  
  # Animations
  animations: ^2.0.11
  
  # Charts for Reports
  fl_chart: ^0.69.0
  
  # UUID Generator
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  
  # Testing
  mockito: ^5.4.4
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
